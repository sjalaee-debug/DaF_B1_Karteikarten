<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00829a">
<title>Wortschatz</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--bg:#eef6f8;--card:#fff;--ink:#12263a;--sub:#4b6275;--teal:#00829a;--tink:#fff;--mag:#a8006a;--ok:#1e7a52;--bad:#b3402f;--line:#c9dbe2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0e1b26;--card:#16283a;--ink:#e7f0f5;--sub:#9db4c4;--teal:#4fc3d8;--tink:#08202b;--mag:#f27ac0;--ok:#6fd1a0;--bad:#f09a8a;--line:#2b4357}}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:18px;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:16px 16px 40px}
a.back{color:var(--teal);text-decoration:none;font-size:.9rem}
h1{font-size:1.35rem;margin:6px 0 2px}
.sub{color:var(--sub);font-size:.9rem;margin:0 0 6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 0 12px}
.bar i{display:block;height:100%;background:var(--ok)}
input[type=search]{width:100%;font:inherit;font-size:.95rem;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.chip{font-size:.85rem;padding:7px 13px;border-radius:20px;border:2px solid var(--line);background:var(--card)}
.chip.on{border-color:var(--teal);background:var(--teal);color:var(--tink);font-weight:700}
select.chip{appearance:auto}
.cnt{text-align:center;color:var(--sub);font-size:.88rem;margin:8px 0}
.fc{perspective:900px;margin:0 0 12px}
.fc button{display:block;width:100%;min-height:300px;padding:0;border:0;background:none;position:relative;transform-style:preserve-3d;transition:transform .45s}
.fc.flip button{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:left;border:2px solid var(--line);background:var(--card);overflow:auto}
.back2{transform:rotateY(180deg);border-color:var(--teal)}
.q{font-size:1.5rem;font-weight:700}
.ans{font-size:1.5rem;font-weight:700;color:var(--teal);margin:0 0 8px}
.face small{color:var(--sub);margin-top:12px;font-size:.88rem}
.row{display:flex;gap:10px;margin:0 0 10px}
.go{flex:1;font-weight:700;padding:13px 10px;border:2px solid var(--teal);border-radius:10px;background:var(--card);color:var(--teal)}
.go.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.go.no{background:var(--card);border-color:var(--bad);color:var(--bad)}
.star{flex:0 0 56px;font-size:1.3rem;color:var(--mag)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}.foot button{font-size:.82rem;padding:7px 12px;border-radius:20px;border:2px solid var(--line);background:var(--card);color:var(--sub)}
.empty{text-align:center;color:var(--sub);padding:40px 0}
@media (prefers-reduced-motion:reduce){.fc button{transition:none}}
</style>
</head>
<body>
<main><div id="top"></div><div id="card"></div><div id="foot"></div></main>
<script>
(function(){
var nr=(new URLSearchParams(location.search).get('l')||'').replace(/\D/g,'');
var sc=document.createElement('script');sc.src='daten/lektion-'+nr+'.js';sc.onload=start;
sc.onerror=function(){document.getElementById('top').innerHTML='<p>Lektion nicht gefunden. <a href="index.html">Zur Übersicht</a></p>'};
document.head.appendChild(sc);
function start(){
var D=window.DATEN,key='dk-'+D.nr,st={k:{},f:{},rev:0,mode:'alle'};
try{var t=JSON.parse(localStorage.getItem(key));if(t)st=Object.assign(st,t)}catch(e){}
function save(){try{localStorage.setItem(key,JSON.stringify(st))}catch(e){}}
document.title='Wortschatz Lektion '+D.nr;
var all=[];
Object.keys(D.s).forEach(function(sec){D.s[sec].forEach(function(r,i){all.push({id:sec+'#'+i,sec:sec,w:r[0],ex:r[1],fa:r[2],en:r[3],syn:r[4]})})});
var sec='*',q='',ci=0,flip=false,deck=[];
var top=document.getElementById('top'),card=document.getElementById('card');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function build(){
 var qq=q.trim().toLowerCase();
 deck=all.filter(function(c){
  if(sec!=='*'&&c.sec!==sec)return false;
  if(st.mode==='offen'&&st.k[c.id]===1)return false;
  if(st.mode==='nochmal'&&st.k[c.id]!==0)return false;
  if(st.mode==='fav'&&!st.f[c.id])return false;
  if(qq&&(c.w+' '+c.fa+' '+c.en+' '+c.syn).toLowerCase().indexOf(qq)<0)return false;
  return true});
 if(ci>=deck.length)ci=0}
function renderTop(){
 var kn=all.filter(function(c){return st.k[c.id]===1}).length;
 var h='<a class="back" href="index.html">← Alle Lektionen</a><h1>Lektion '+D.nr+'</h1><p class="sub">'+kn+' von '+all.length+' gewusst</p><div class="bar"><i style="width:'+(kn/all.length*100)+'%"></i></div>'+
 '<input type="search" id="q" placeholder="Wort suchen (Deutsch, Persisch, Englisch)" value="'+esc(q)+'" aria-label="Suche"><div class="chips">'+
 '<button class="chip'+(sec==='*'?' on':'')+'" data-s="*">Alle</button>';
 Object.keys(D.s).forEach(function(k){h+='<button class="chip'+(k===sec?' on':'')+'" data-s="'+esc(k)+'">'+esc(k)+'</button>'});
 h+='</div><div class="chips"><select class="chip" id="mode" aria-label="Auswahl">';
 [['alle','Alle Karten'],['offen','Noch offen'],['nochmal','Nochmal üben'],['fav','Favoriten ★']].forEach(function(o){h+='<option value="'+o[0]+'"'+(st.mode===o[0]?' selected':'')+'>'+o[1]+'</option>'});
 h+='</select><button class="chip" id="rev">'+(st.rev?'Persisch/Englisch → Deutsch':'Deutsch → Persisch/Englisch')+'</button></div>';
 top.innerHTML=h;
 document.getElementById('q').oninput=function(){q=this.value;ci=0;flip=false;build();renderCard()};
 top.querySelectorAll('[data-s]').forEach(function(b){b.onclick=function(){sec=b.dataset.s;ci=0;flip=false;build();renderTop();renderCard()}});
 document.getElementById('mode').onchange=function(){st.mode=this.value;save();ci=0;flip=false;build();renderTop();renderCard()};
 document.getElementById('rev').onclick=function(){st.rev=st.rev?0:1;save();flip=false;renderTop();renderCard()};
}
function faces(c){
 var info='<small>'+(c.syn?'Synonym: '+esc(c.syn)+'<br>':'')+esc(c.ex)+'</small>';
 var de='<span class="q">'+esc(c.w)+'</span>',tr='<span class="ans" dir="rtl" lang="fa">'+esc(c.fa)+'</span><b>'+esc(c.en)+'</b>';
 return st.rev?[tr,de+info]:[de,tr+info]}
function renderCard(){
 if(!deck.length){card.innerHTML='<p class="empty">Keine Karten in dieser Auswahl.</p>';return}
 var c=deck[ci],f=faces(c),mk=st.k[c.id]===1?' · ✓ gewusst':st.k[c.id]===0?' · nochmal':'';
 card.innerHTML='<p class="cnt">Karte '+(ci+1)+' von '+deck.length+mk+'</p>'+
 '<div class="fc'+(flip?' flip':'')+'" id="fc"><button aria-label="Karte umdrehen"><span class="face">'+f[0]+'</span><span class="face back2">'+f[1]+'</span></button></div>'+
 '<div class="row"><button class="go" id="prev">Zurück</button><button class="go star" id="star" aria-label="Favorit">'+(st.f[c.id]?'★':'☆')+'</button><button class="go" id="nxt">Weiter</button></div>'+
 '<div class="row"><button class="go no" id="no">Nochmal</button><button class="go ok" id="yes">Gewusst</button></div>'+
 '<p class="cnt"><button class="chip" id="mix">Karten mischen</button></p>';
 document.getElementById('fc').onclick=function(){flip=!flip;this.classList.toggle('flip',flip)};
 document.getElementById('prev').onclick=function(){go(-1)};
 document.getElementById('nxt').onclick=function(){go(1)};
 document.getElementById('star').onclick=function(){st.f[c.id]=st.f[c.id]?0:1;save();renderCard()};
 document.getElementById('no').onclick=function(){mark(0)};
 document.getElementById('yes').onclick=function(){mark(1)};
 document.getElementById('mix').onclick=function(){deck.sort(function(){return Math.random()-.5});ci=0;flip=false;renderCard()};
}
function go(d){if(!deck.length)return;ci=(ci+d+deck.length)%deck.length;flip=false;renderCard()}
function mark(v){
 var c=deck[ci],nx=deck[(ci+1)%deck.length];
 st.k[c.id]=v;save();flip=false;
 var order=deck.slice();build();
 var j=deck.indexOf(nx);ci=j<0?0:j;
 renderTop();renderCard()}
document.addEventListener('keydown',function(e){
 if(e.target&&/INPUT|SELECT/.test(e.target.tagName))return;
 if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1);
 else if(e.key===' '&&deck.length){e.preventDefault();flip=!flip;renderCard()}});
var foot=document.getElementById('foot');
foot.className='foot';
foot.innerHTML='<button id="rs">Fortschritt zurücksetzen</button><button id="rf">Favoriten löschen</button>';
document.getElementById('rs').onclick=function(){
 if(confirm('Alle „Gewusst“- und „Nochmal“-Markierungen dieser Lektion zurücksetzen?')){st.k={};save();ci=0;flip=false;build();renderTop();renderCard()}};
document.getElementById('rf').onclick=function(){
 if(confirm('Alle Favoriten (★) dieser Lektion löschen?')){st.f={};save();ci=0;flip=false;build();renderTop();renderCard()}};
build();renderTop();renderCard();
}
})();
</script>
</body>
</html>
